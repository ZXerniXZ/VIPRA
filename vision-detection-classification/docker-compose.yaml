version: "3.9"

services:
  # ─────────── Ollama (LLM server) ───────────
  ollama:
    image: zxernixz7/ollama-vipra   # tag che pubblicherai
    platform: linux/arm64
    ports:
      - "11435:11434"
    volumes:
      - ./volumes/ollama:/root/.ollama  # Persistenza modelli
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────── FastAPI + Qwen2.5VL ───────────
  serverai:
    build:
      context: ./serverAI
      dockerfile: Dockerfile
    image: serverai-vipra:qwen
    platform: linux/arm64
    mem_limit: 5g
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "8002:8000"  # Porta legacy per compatibilità con IMX500
    restart: unless-stopped
    command:
      - --mqtt-enabled
      - --ollama-url
      - http://ollama:11434
      - --status-broker
      - mosquitto
      - --status-port
      - "9000"
      - --status-topic
      - serverai/status
      - --result-topic
      - serverai/result
      - --host
      - "0.0.0.0"
      - --port
      - "8000"

  # ─────────── Mosquitto (MQTT broker) ───────────
  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    ports:
      - "9000:9000"      # MQTT TCP
      - "9001:9001"      # WebSocket (opzionale)
    restart: unless-stopped
    volumes:
      - ./volumes/mosquitto/config:/mosquitto/config
      - ./volumes/mosquitto/data:/mosquitto/data
      - ./volumes/mosquitto/log:/mosquitto/log
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s

  # ─────────── IMX500 AI Camera publisher ───────────
  imx500:
    image: zxernixz7/imx500-vipra
    platform: linux/arm64
    privileged: true
    network_mode: host
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./volumes/imx500-captures:/app/captures
      - /run/udev:/run/udev:ro
      - /lib/firmware:/lib/firmware:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /dev/dma_heap:/dev/dma_heap:ro
    command:
      - --model
      - /usr/share/imx500-models/imx500_network_efficientdet_lite0_pp.rpk
      - --broker
      - localhost
      - --port
      - "9000"          # nuova porta MQTT
      - --topic
      - ai/camera
      - --savedir
      - /app/captures
      - --threshold
      - "0.4"
      - --max-boxes
      - "1"
      - --classes
      - "2"
      - "3"
      - --iou-threshold
      - "0.3"
      - --save-images
      - --loglevel
      - INFO
      - --status-topic
      - serverai/status
